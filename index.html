<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your account">
  <title>Sign in</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
    }

    .login-card {
      width: min(100%, 400px);
      padding: 36px;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 16px 40px rgb(15 23 42 / 10%);
    }

    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    .intro { margin: 0 0 28px; color: #64748b; }
    .field { margin-bottom: 18px; }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }

    input:focus {
      outline: 3px solid rgb(79 70 229 / 20%);
      border-color: #4f46e5;
    }

    button {
      width: 100%;
      margin-top: 6px;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: #4f46e5;
      color: #fff;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover { background: #4338ca; }
    button:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 3px; }
    .message { min-height: 1.4em; margin: 16px 0 0; color: #475569; font-size: 0.9rem; }

    @media (max-width: 480px) {
      .login-card { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Welcome back</h1>
    <p class="intro">Sign in to your account to continue.</p>

    <form id="login-form">
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>

      <button type="submit">Sign in</button>
      <p class="message" id="form-message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    // UI demo only: connect this form to a secure server-side authentication endpoint.
    document.getElementById("login-form").addEventListener("submit", (event) => {
      event.preventDefault();
      document.getElementById("form-message").textContent =
        "Login form submitted. Connect it to your authentication service to sign in.";
    });
  </script>
</body>
</html>
